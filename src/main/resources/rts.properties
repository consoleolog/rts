# 기본 설정 (로컬 개발용)
# 운영 서버는 ${catalina.base}/conf/rts.properties 를 두면 이 값을 덮어쓴다.

# DB (MySQL 5.x)
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/rts?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
db.username=rts
db.password=rts
db.pool.max-size=10

# Liquibase: 기동 시 changelog 적용 여부
liquibase.enabled=true

# Hibernate: 스키마는 Liquibase로만 관리하고 Hibernate는 검증만 한다
hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
hibernate.hbm2ddl.auto=validate
hibernate.show_sql=false
hibernate.jdbc.time_zone=Asia/Seoul
